<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>架材重量試算</title>
<meta name="description" content="架材單重 × 數量即時計算總重與所需車數。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
<style>
/* Layout: sticky load-ticket header with live total, then a grouped parts list (重型 / 輕型 tabs) */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --line:#d6dce3;
  --fg:#1b2430; --muted:#5d6b7b; --accent:#c45a00; --accent-soft:#fff1e3;
  --steel:#2f4a66; --steel-fg:#ffffff; --ok:#1f7a4d;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --surface-2:#202933; --line:#2e3946;
  --fg:#e6ebf0; --muted:#94a2b3; --accent:#ff9a3d; --accent-soft:#3a2614;
  --steel:#24384e; --steel-fg:#eef3f8; --ok:#5cc792; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --surface-2:#202933; --line:#2e3946;
  --fg:#e6ebf0; --muted:#94a2b3; --accent:#ff9a3d; --accent-soft:#3a2614;
  --steel:#24384e; --steel-fg:#eef3f8; --ok:#5cc792; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--steel)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel);color:var(--steel-fg);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top .wrap{padding-block:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.04em}
.brand span{font-size:12px;opacity:.75}
.totals{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.tot{display:flex;flex-direction:column;align-items:flex-end}
.tot small{font-size:11px;letter-spacing:.08em;opacity:.75}
.tot b{font-family:var(--font-num);font-size:26px;line-height:1.1;font-weight:600}
.tot.big b{font-size:34px;color:#ffc58a}
.tot b i{font-style:normal;font-size:13px;margin-left:3px;opacity:.8}

/* ticket fields */
.ticket{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12px;color:var(--muted);letter-spacing:.05em}
.field input,.field select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--fg);min-width:0;width:100%}

/* controls */
.bar{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:8px 16px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.tabs button .num{font-size:12px;font-weight:500;opacity:.9}
.search{flex:1 1 180px;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.btn{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.warn{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* list */
.list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grp{padding:6px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.grp:first-child{border-top:0}
.grp .num{color:var(--fg);font-weight:500}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) 82px 128px 96px;gap:10px;align-items:center;padding:7px 14px;border-top:1px solid var(--line)}
.row.on{background:var(--accent-soft)}
.no{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.name{min-width:0}
.name b{font-weight:500}
.name span{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.name .pcode{margin-left:8px;font-family:var(--font-num);font-size:12px;padding:0 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--steel);white-space:nowrap}
:root[data-theme="dark"] .name .pcode{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .name .pcode{color:var(--muted)}}
.name.edit{display:flex;flex-direction:column;gap:4px}
.name.edit input{font:inherit;font-size:14px;padding:4px 7px;border:1px dashed var(--accent);border-radius:5px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.name.edit input.spec{font-size:12.5px}
.unit{text-align:right;font-family:var(--font-num);font-size:13.5px;color:var(--muted)}
.unit input{width:70px;text-align:right;font:inherit;padding:4px 6px;border:1px dashed var(--accent);border-radius:5px;background:var(--surface);color:var(--fg)}
.qty{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.qty button{width:30px;border:0;background:var(--surface-2);color:var(--fg);font-size:17px;cursor:pointer;flex:none}
.qty input{width:100%;min-width:0;border:0;text-align:center;font-family:var(--font-num);font-size:15px;padding:6px 2px;background:transparent;color:var(--fg)}
.qty input::-webkit-inner-spin-button{appearance:none}
.sub{text-align:right;font-family:var(--font-num);font-weight:600}
.sub.zero{color:var(--line);font-weight:500}
.head{font-size:12px;color:var(--muted);background:var(--surface);border-top:0;padding-block:8px;letter-spacing:.05em}
.head div:nth-child(3),.head div:nth-child(5){text-align:right}
.head div:nth-child(4){text-align:center}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* packing notes */
.notes{margin:18px 0 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h2{margin:0 0 8px;font-size:15px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.card table{width:100%;border-collapse:collapse;font-size:14px}
.card td{padding:4px 0;border-top:1px solid var(--line)}
.card td:last-child{text-align:right;font-family:var(--font-num);white-space:nowrap;padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.confirm{display:flex;gap:6px;align-items:center;font-size:14px}

/* vehicle planner */
.fleet{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fleet-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.fleet-head h2{margin:0;font-size:16px;flex:1 1 auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--muted);padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button small{font-family:var(--font-num);font-weight:500;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-fg)}
.cap{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.cap input{width:80px;font-family:var(--font-num);font-size:15px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--fg)}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.verdict b{font-size:22px}
.pill{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:20px;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.over{color:var(--accent)}
.verdict .muted{color:var(--muted);font-size:14px}
.trucks{display:grid;gap:8px}
.truck{display:grid;grid-template-columns:112px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:14px}
.truck .lbl{color:var(--muted)}
.truck .lbl b{color:var(--fg);font-weight:700;margin-left:4px}
.meter{height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--steel)}
.truck.full .meter i{background:var(--accent)}
.truck .val{text-align:right;font-family:var(--font-num)}
.fleet .hint{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:640px){.truck{grid-template-columns:minmax(0,1fr);row-gap:2px}.truck .val{grid-column:1!important}.truck .val{grid-column:2;text-align:left}}

@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) 116px;grid-template-areas:"name qty" "unit sub";row-gap:2px}
  .row .no{display:none}
  .row .name{grid-area:name}.row .qty{grid-area:qty}.row .unit{grid-area:unit;text-align:left}.row .sub{grid-area:sub}
  .head{display:none}
  .tot b{font-size:20px}.tot.big b{font-size:26px}
  .brand h1{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>架材重量試算</h1><span>單重 × 數量，輸入即時計算</span></div>
    <div class="totals">
      <div class="tot"><small id="tTruckLbl">板車</small><b id="tTrucks">0<i>台</i></b></div>
      <div class="tot"><small>總數</small><b id="tCount">0<i>支</i></b></div>
      <div class="tot"><small>重型</small><b id="tHeavy">0<i>kg</i></b></div>
      <div class="tot"><small>輕型</small><b id="tLight">0<i>kg</i></b></div>
      <div class="tot big"><small id="tTonLbl">總重 · 0.000 噸</small><b id="tAll">0<i>kg</i></b></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="ticket" aria-label="出貨資料">
    <div class="field"><label for="fDate">日期</label><input id="fDate" type="date"></div>
    <div class="field"><label for="fCust">客戶名稱</label><input id="fCust" placeholder="例：仕億"></div>
    <div class="field"><label for="fContract">合約編號</label><input id="fContract"></div>
    <div class="field"><label for="fTrip">車次</label><input id="fTrip" inputmode="numeric"></div>
  </section>

  <section class="fleet" aria-label="車輛試算">
    <div class="fleet-head">
      <h2>車輛試算</h2>
      <div class="seg" role="group" aria-label="預計車種" id="truckSeg">
      </div>
      <label class="cap" for="fCap" id="capWrap">每車載重上限 <input id="fCap" type="number" min="0" step="0.5" inputmode="decimal"> 噸</label>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="trucks" id="trucks"></div>
    <p class="hint">依總重試算，實際裝載仍需依材料長度與堆疊方式調整。</p>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-heavy" data-k="heavy" aria-selected="true">重型 <span class="num" id="cHeavy"></span></button>
      <button role="tab" id="tab-light" data-k="light" aria-selected="false">輕型 <span class="num" id="cLight"></span></button>
    </div>
    <input id="q" class="search" type="search" placeholder="搜尋品名、規格或產品代號，例：橫1.8、H66180">
    <label class="chk"><input type="checkbox" id="onlyFilled"> 只看已填</label>
    <button class="btn" id="copyBtn">複製清單</button>
    <span id="clearWrap"><button class="btn warn" id="clearBtn">全部清除</button></span>
  </div>

  <div class="list" id="list" role="tabpanel"></div>

  <section class="notes">
    <div class="card">
      <h2>本單明細</h2>
      <table id="summary"></table>
    </div>
    <div class="card">
      <h2>包裝數量參考</h2>
      <ul>
        <li>斜桿：300 支／格</li><li>橫桿：250 支／格</li><li>0.6m 橫桿：250 支／箱</li>
        <li>0.9m 橫桿：350 支／格</li><li>主架：100 支／格</li><li>0.2m、0.25m：500 支／格</li>
        <li>0.5m：300 支／格</li><li>蜂巢鋼：30 支／梱</li><li>Top Beam：40 支／梱</li>
      </ul>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number(n).toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:d});
const unitW=it=>it.w!=null?it.w:(parseFloat(S.uw[it.id])||0);
const qtyOf=it=>parseFloat(S.qty[it.id])||0;
const subOf=it=>Math.round(unitW(it)*qtyOf(it)*1000)/1000;
const grpKey=n=>n.replace(/^\(輕\)/,"").trim();
const grpOf=it=>it.custom?CUSTOM_GRP:grpKey(it.name);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function totals(k){let w=0,c=0;for(const it of ITEMS[k]){w+=subOf(it);c+=qtyOf(it)}return{w:Math.round(w*1000)/1000,c}}

function renderList(){
  // 中文與數字／英文自動拆開分別比對，例如「橫1.8」= 含「橫」且含「1.8」
  const q=($("q").value.trim().toLowerCase().match(/[\u3400-\u9fff\uf900-\ufaff]+|[^\s\u3400-\u9fff\uf900-\ufaff]+/g)||[]);
  const only=$("onlyFilled").checked;
  const items=ITEMS[S.tab].filter(it=>{
    if(only&&!qtyOf(it))return false;
    const hay=(it.name+" "+it.spec+" "+it.code).toLowerCase();
    // 數字要從數字開頭比對：「3」找得到 3.0m，不會找到 60.3；輸入完整 NO. 也可以
    return q.every(t=>/^[\d.]/.test(t)?new RegExp("(^|[^\\d.])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(hay)||t===String(it.no).toLowerCase():hay.includes(t));
  });
  let html='<div class="row head"><div>NO.</div><div>品名／規格／產品代號</div><div>單重 kg</div><div>數量</div><div>支重 kg</div></div>';
  let last=null;
  const groups={};for(const it of items){const g=grpOf(it);groups[g]=(groups[g]||0)+subOf(it)}
  for(const it of items){
    const g=grpOf(it);
    if(g!==last){html+=`<div class="grp"><span>${esc(g)}</span><span class="num" data-g="${esc(g)}">${groups[g]?fmt(groups[g])+" kg":""}</span></div>`;last=g}
    const q=S.qty[it.id]??"";const sub=subOf(it);
    const unit=it.w!=null?fmt(it.w,3):`<input type="number" step="any" min="0" placeholder="${it.custom?"單重kg":"待填"}" aria-label="${esc(it.name)} 單重" data-uw="${it.id}" id="uw-${it.id.replace(':','-')}" value="${esc(S.uw[it.id]??"")}">`;
    html+=`<div class="row${qtyOf(it)?" on":""}" data-row="${it.id}">
      <div class="no">${esc(it.no)}</div>
      ${it.custom?`<div class="name edit"><input data-cn="${it.id}" placeholder="品名（自訂品項 ${it.no.slice(1)}）" aria-label="自訂品項 ${it.no.slice(1)} 品名" value="${esc(S.cust[it.id]?.name??"")}"><input class="spec" data-cs="${it.id}" placeholder="規格" aria-label="自訂品項 ${it.no.slice(1)} 規格" value="${esc(S.cust[it.id]?.spec??"")}"><input class="spec" data-cc="${it.id}" placeholder="產品代號" aria-label="自訂品項 ${it.no.slice(1)} 產品代號" value="${esc(S.cust[it.id]?.code??"")}"></div>`
        :`<div class="name"><b>${esc(it.name)}</b>${it.code?`<code class="pcode">${esc(it.code)}</code>`:""}<span>${esc(it.spec)||"—"}</span></div>`}
      <div class="unit">${unit}</div>
      <div class="qty"><button data-step="-1" data-id="${it.id}" aria-label="減少">−</button><input type="number" min="0" step="1" inputmode="numeric" placeholder="0" aria-label="${esc(it.name+" "+it.spec)} 數量" id="q-${it.id.replace(':','-')}" data-q="${it.id}" value="${esc(q)}"><button data-step="1" data-id="${it.id}" aria-label="增加">+</button></div>
      <div class="sub${sub?"":" zero"}" data-sub="${it.id}">${sub?fmt(sub):"0"}</div>
    </div>`;
  }
  if(!items.length)html+=`<div class="empty">${only?"這一頁還沒有填數量的品項。":"找不到符合的品項，試試別的關鍵字。"}</div>`;
  $("list").innerHTML=html;
}

function updateRow(id){
  const k=id.split(":")[0];const it=ITEMS[k].find(x=>x.id===id);
  const row=document.querySelector(`[data-row="${id}"]`);
  if(row){const s=subOf(it);row.classList.toggle("on",!!qtyOf(it));const c=row.querySelector("[data-sub]");c.textContent=s?fmt(s):"0";c.classList.toggle("zero",!s)}
  // group subtotal
  const g=grpOf(it);const el=[...document.querySelectorAll("[data-g]")].find(e=>e.dataset.g===g);
  if(el){const t=ITEMS[k].filter(x=>grpOf(x)===g).reduce((a,x)=>a+subOf(x),0);el.textContent=t?fmt(t)+" kg":""}
}

function renderTotals(){
  const h=totals("heavy"),l=totals("light"),all=h.w+l.w;
  $("tHeavy").innerHTML=fmt(h.w)+"<i>kg</i>";$("tLight").innerHTML=fmt(l.w)+"<i>kg</i>";
  $("tAll").innerHTML=fmt(all)+"<i>kg</i>";$("tTonLbl").textContent="總重 · "+(all/1000).toFixed(3)+" 噸";
  $("tCount").innerHTML=fmt(h.c+l.c,0)+"<i>支</i>";
  $("cHeavy").textContent=h.w?fmt(h.w,0)+"kg":"";$("cLight").textContent=l.w?fmt(l.w,0)+"kg":"";
  let rows="";
  for(const k of ["heavy","light"])for(const it of ITEMS[k])if(qtyOf(it))rows+=`<tr><td>${LABEL[k]}｜${it.code?esc(it.code)+" ":""}${esc(it.name)} ${esc(it.spec)} × ${fmt(qtyOf(it),0)}</td><td>${fmt(subOf(it))} kg</td></tr>`;
  $("summary").innerHTML=rows?rows+`<tr><td><b>合計</b></td><td><b>${fmt(all)} kg</b></td></tr>`:'<tr><td style="color:var(--muted);border:0">在上方輸入數量後，品項會列在這裡。</td><td style="border:0"></td></tr>';
  renderFleet(all);
}

if(S.f.truck==="吊車")S.f.truck="吊車A";
const AUTO="自動";
if(!S.f.truck)S.f.truck=AUTO;
const truckKey=()=>S.f.truck===AUTO||TNAME[S.f.truck]?S.f.truck:AUTO;
const capKgOf=k=>(parseFloat(S.cap[k])||0)*1000;
const truckLabel=k=>{const c=parseFloat(S.cap[k]);return TNAME[k]+(c>0?" "+fmt(c)+" 噸":"")};
const truckType=()=>truckKey()===AUTO?"自動搭配":truckLabel(truckKey());
$("truckSeg").innerHTML=`<button type="button" data-truck="${AUTO}" aria-pressed="false"></button>`+TRUCKS.map(t=>`<button type="button" data-truck="${t[0]}" aria-pressed="false"></button>`).join("");
// 回傳每台車 {k: 車種, load: 裝載 kg, cap: 上限 kg}；error 表示缺少載重設定
function fleetPlan(totalKg){
  const key=truckKey();
  if(key!==AUTO){
    const cap=capKgOf(key);if(!cap)return{error:TNAME[key]};
    const n=totalKg>0?Math.ceil(totalKg/cap-1e-9):0;
    const list=[];let left=totalKg;
    for(let i=0;i<n;i++){const l=Math.min(cap,left);list.push({k:key,load:l,cap});left-=l}
    return{list};
  }
  // 自動搭配：先用板車裝滿，剩下的重量優先配貨車，貨車裝不下才配吊車；都裝不下就再加一台板車
  const big=capKgOf("板車");if(!big)return{error:"板車"};
  if(totalKg<=0)return{list:[]};
  if(totalKg<=big+1e-6)return{list:[{k:"板車",load:totalKg,cap:big}]};
  const n=Math.floor(totalKg/big+1e-9),list=[];
  for(let i=0;i<n;i++)list.push({k:"板車",load:big,cap:big});
  const rest=totalKg-n*big;
  if(rest>1e-6){
    // 優先用貨車（裝得下的最小一台），貨車都裝不下才用吊車
    const fitOf=name=>TRUCKS.filter(t=>t[1]===name&&capKgOf(t[0])>=rest-1e-6).sort((a,b)=>capKgOf(a[0])-capKgOf(b[0]))[0];
    const fit=fitOf("貨車")||fitOf("吊車");
    const k=fit?fit[0]:"板車";list.push({k,load:rest,cap:capKgOf(k)});
  }
  return{list};
}
function fleetSummary(list){
  const c={};for(const x of list){const l=truckLabel(x.k);c[l]=(c[l]||0)+1}
  return Object.entries(c).map(([l,n])=>`${l} × ${n}`).join("＋");
}
function renderFleet(all){
  const k=truckKey(),auto=k===AUTO;
  document.querySelectorAll("[data-truck]").forEach(b=>{const bk=b.dataset.truck;
    if(bk===AUTO)b.innerHTML="自動搭配";else{const c=parseFloat(S.cap[bk]);b.innerHTML=esc(TNAME[bk])+(c>0?`<small>${fmt(c)}t</small>`:"")}
    b.setAttribute("aria-pressed",bk===k)});
  $("capWrap").hidden=auto;
  const capEl=$("fCap");if(!auto&&document.activeElement!==capEl)capEl.value=S.cap[k];
  capEl.placeholder="請輸入";
  const p=fleetPlan(all);
  $("tTruckLbl").textContent=truckType();
  if(p.error){
    $("tTrucks").innerHTML="—";
    $("verdict").innerHTML=`<span class="muted">請先填入${p.error}每車載重上限（噸），即可算出需要幾台車。</span>`;
    $("trucks").innerHTML="";return;
  }
  const L=p.list,n=L.length;
  $("tTrucks").innerHTML=n+"<i>台</i>";
  if(!n){$("verdict").innerHTML=`<span class="muted">輸入數量後會算出需要的車數。${auto?"超過一台板車時，剩下的重量會自動搭配吊車或貨車。":""}</span>`;$("trucks").innerHTML="";return}
  const last=L[n-1],spare=Math.max(0,last.cap-last.load);
  const head=auto?`<b>需要 ${n} 台車</b><span class="pill ${n>1?"over":"ok"}">${esc(fleetSummary(L))}</span>`
    :`<b>需要 ${n} 台${TNAME[k]}</b><span class="pill ${n>1?"over":"ok"}">${n>1?`超過單車 ${fmt(last.cap/1000)} 噸`:`未超過 ${fmt(last.cap/1000)} 噸`}</span>`;
  $("verdict").innerHTML=head+`<span class="muted">最後一台還可裝 <span class="num">${fmt(spare,0)}</span> kg</span>`;
  $("trucks").innerHTML=L.map((x,i)=>{
    const pct=Math.min(100,x.load/x.cap*100);
    return `<div class="truck${pct>=99.99?" full":""}"><span class="lbl">第 ${i+1} 車<b>${esc(TNAME[x.k])}</b></span><div class="meter" role="img" aria-label="第 ${i+1} 車 ${esc(TNAME[x.k])} 裝載 ${pct.toFixed(0)}%"><i style="width:${pct}%"></i></div><span class="val">${(x.load/1000).toFixed(3)} / ${fmt(x.cap/1000)} 噸</span></div>`;
  }).join("");
}
document.querySelectorAll("[data-truck]").forEach(b=>b.addEventListener("click",()=>{S.f.truck=b.dataset.truck;save();renderTotals()}));
$("fCap").addEventListener("input",()=>{if(truckKey()!==AUTO)S.cap[truckKey()]=$("fCap").value;save();renderTotals()});

function setQty(id,v){
  v=String(v).trim();
  if(v===""||+v===0)delete S.qty[id];else S.qty[id]=Math.max(0,+v);
  save();updateRow(id);renderTotals();
}

$("list").addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.q)setQty(t.dataset.q,t.value);
  if(t.dataset.cn||t.dataset.cs||t.dataset.cc){const id=t.dataset.cn||t.dataset.cs||t.dataset.cc;const c=S.cust[id]||(S.cust[id]={});c[t.dataset.cn?"name":t.dataset.cs?"spec":"code"]=t.value;
    if(!c.name&&!c.spec&&!c.code)delete S.cust[id];save();renderTotals()}
  if(t.dataset.uw){if(t.value==="")delete S.uw[t.dataset.uw];else S.uw[t.dataset.uw]=t.value;save();updateRow(t.dataset.uw);renderTotals()}
});
$("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-step]");if(!b)return;
  const id=b.dataset.id;const n=Math.max(0,(parseFloat(S.qty[id])||0)+ +b.dataset.step);
  const inp=document.querySelector(`[data-q="${id}"]`);if(inp)inp.value=n||"";setQty(id,n);
});
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  S.tab=b.dataset.k;save();document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));renderList();
}));
$("q").addEventListener("input",renderList);
$("onlyFilled").addEventListener("change",renderList);

// ticket fields
const FIELDS={fDate:"date",fCust:"cust",fContract:"contract",fTrip:"trip"};
for(const [id,k] of Object.entries(FIELDS)){
  const el=$(id);el.value=S.f[k]??(k==="date"?new Date().toISOString().slice(0,10):"");
  el.addEventListener("input",()=>{S.f[k]=el.value;save()});
}

// clear with inline confirm
function bindClear(){
  $("clearBtn").addEventListener("click",()=>{
    $("clearWrap").innerHTML='<span class="confirm">清除所有數量？<button class="btn warn" id="yesClr">清除</button><button class="btn" id="noClr">取消</button></span>';
    $("yesClr").onclick=()=>{S.qty={};save();renderList();renderTotals();resetClear();toast("已清除所有數量")};
    $("noClr").onclick=resetClear;
  });
}
function resetClear(){$("clearWrap").innerHTML='<button class="btn warn" id="clearBtn">全部清除</button>';bindClear()}
bindClear();

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}

$("copyBtn").addEventListener("click",()=>{
  const f=S.f;const h=totals("heavy"),l=totals("light");
  let txt=`日期：${$("fDate").value}　客戶：${f.cust||""}　合約編號：${f.contract||""}　車次：${f.trip||""}　車種：${truckType()}\n`;
  for(const k of ["heavy","light"]){
    const rows=ITEMS[k].filter(qtyOf);if(!rows.length)continue;
    txt+=`\n【${LABEL[k]}】\n`;
    for(const it of rows)txt+=`${it.code?it.code+" ":""}${it.name} ${it.spec}　${fmt(unitW(it),3)}kg × ${fmt(qtyOf(it),0)} = ${fmt(subOf(it))} kg\n`;
    txt+=`小計：${fmt(totals(k).w)} kg\n`;
  }
  txt+=`\n總數：${fmt(h.c+l.c,0)}　總重：${fmt(h.w+l.w)} kg（${((h.w+l.w)/1000).toFixed(3)} 噸）`;
  const p=fleetPlan(h.w+l.w);
  if(p.list&&p.list.length)txt+=`\n車輛：共 ${p.list.length} 台（${fleetSummary(p.list)}）\n`+p.list.map((x,i)=>`　第 ${i+1} 車 ${TNAME[x.k]}：${(x.load/1000).toFixed(3)} / ${fmt(x.cap/1000)} 噸`).join("\n");
  navigator.clipboard.writeText(txt).then(()=>toast("清單已複製")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("清單已複製")}catch(e){toast("無法複製，請手動選取")}ta.remove();
  });
});

let hadSaved=false;try{hadSaved=localStorage.getItem(STORE)!==null}catch(e){}
if(!hadSaved)Object.assign(S.qty,{"heavy:3":56,"heavy:4":32,"heavy:14":20,"heavy:24":228,"heavy:31":206});
document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.k===S.tab));
renderList();renderTotals();
</script>
