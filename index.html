<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.1/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="hero"><div class="container"><p class="eyebrow">一起讓工作環境更好</p><h1>報修登記</h1><p>記下問題，讓每一件報修都有紀錄。</p></div></header>
  <main class="container">
    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading"><div><p class="eyebrow">新增案件</p><h2 id="form-title">哪裡需要協助？</h2></div><span class="required-note">所有欄位皆必填</span></div>
      <p class="notice">示範系統・清單公開可見，請使用虛構姓名與地點，勿填入個資或機密。</p>
      <form id="repair-form">
        <fieldset id="form-fields" disabled>
          <div class="form-grid">
            <label>報修人<input name="reporter_name" autocomplete="name" required maxlength="100" placeholder="例如：陳小明（虛構）"></label>
            <label>地點或部門<input name="location" required maxlength="200" placeholder="例如：示範辦公室 2 樓"></label>
            <label>類別<select name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
            <label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
          </div>
          <label class="description-label">問題說明<textarea name="description" required maxlength="5000" rows="5" placeholder="請描述問題、發生情形與需要協助的事項。"></textarea></label>
          <div class="form-footer"><span>建立時間與初始狀態由系統填入</span><button id="submit-button" type="submit">送出報修</button></div>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite"></p>
      <noscript><p class="message error">請啟用 JavaScript 才能新增報修與讀取清單。</p></noscript>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="section-heading"><div><p class="eyebrow">案件追蹤</p><h2 id="list-title">最近報修</h2><p class="muted">最近 20 筆，依建立時間由新到舊</p></div><button id="refresh-button" class="secondary" type="button" disabled>重新整理</button></div>
      <div id="urgency-filters" class="urgency-filters" role="group" aria-label="依緊急程度篩選">
        <button type="button" data-urgency="全部" aria-pressed="true">全部</button>
        <button type="button" data-urgency="高" aria-pressed="false">高</button>
        <button type="button" data-urgency="中" aria-pressed="false">中</button>
        <button type="button" data-urgency="低" aria-pressed="false">低</button>
      </div>
      <p id="filter-message" class="message" role="status" aria-live="polite"></p>
      <p id="list-message" class="message" role="status" aria-live="polite">正在載入清單…</p>
      <div id="request-list" aria-busy="true"></div>
    </section>
  </main>
  <footer class="container page-footer">報修登記 · 讓問題被看見，讓改善有跡可循。</footer>
</body>
</html>
