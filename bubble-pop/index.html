<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8f2"><link rel="icon" type="image/png" sizes="180x180" href="./bubble-icon.png?v=3"><link rel="apple-touch-icon" sizes="180x180" href="./bubble-icon.png?v=3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>啵啵時光｜療癒泡泡紙</title>
<style>
:root{--bg:#f4f8f2;--ink:#34443d;--muted:#82958a;--accent:#568a76;--card:#fffdf7;--border:#dce9df;--tray1:#ffffffaa;--tray2:#dceee3bb;--sheet1:#c9e4d6;--sheet2:#e3f3e9;--sheet3:#cce8d8;--sheetBorder:#afd2bf;--bubbleDark:#80b9a0;--bubbleMid:#addbc6;--bubbleLight:#d9f4e5;--bubbleShadow:#55957966;--popped1:#9bcab1;--popped2:#c0dfcb;--popped3:#dcefe0;--progress:#d7e8dc}
*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:calc(14px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 0%,var(--glow1,#d9f0e5),transparent 42%),radial-gradient(ellipse at 90% 100%,var(--glow2,#f8e9dc),transparent 45%),var(--bg);transition:background .4s,color .3s}
main{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:900}.pill{font-size:11px;background:var(--card);padding:8px 11px;border-radius:30px;color:var(--accent)}h1{font-size:clamp(32px,8vw,48px);margin:18px 0 4px;letter-spacing:-.05em}.sub{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:9px 7px;text-align:center;min-width:0}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}.stat.egg strong{color:#b47d3c}
.actions{display:flex;gap:8px;margin-bottom:12px}.btn{flex:1;border:1px solid var(--border);border-radius:14px;padding:12px 8px;background:var(--card);color:var(--accent);font:700 13px system-ui;touch-action:manipulation}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.tray{padding:12px;border-radius:23px;background:linear-gradient(135deg,var(--tray1),var(--tray2));border:1px solid var(--border);box-shadow:0 12px 35px #45645518}.sheet{padding:10px;border-radius:17px;background:linear-gradient(130deg,var(--sheet1),var(--sheet2) 48%,var(--sheet3));border:1px solid var(--sheetBorder);touch-action:none;user-select:none;-webkit-user-select:none}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.bubble{display:block;position:relative;width:100%;aspect-ratio:1;border:0;border-radius:50%;padding:0;background:radial-gradient(circle at 29% 21%,#ffffffef 0 6%,#f5fff9cc 12%,transparent 38%),radial-gradient(circle at 67% 72%,var(--bubbleDark),var(--bubbleMid) 50%,var(--bubbleLight) 78%,#fff 96%);box-shadow:inset -3px -5px 7px var(--bubbleShadow),inset 2px 2px 5px #ffffffdb,0 3px 3px var(--bubbleShadow),0 6px 8px #608b8030;touch-action:none;transition:transform .12s,background .12s}.bubble:after{content:"";position:absolute;width:39%;height:20%;top:15%;left:18%;border-radius:50%;background:#fff9;filter:blur(2px);transform:rotate(-31deg)}.bubble.popped{transform:scale(.84);background:radial-gradient(ellipse at 52% 54%,var(--popped1),var(--popped2) 58%,var(--popped3));box-shadow:inset 2px 3px 9px var(--bubbleShadow),inset -2px -3px 5px #ffffff7c}.bubble.popped:after{opacity:0}
.progress{height:7px;margin-top:13px;border-radius:8px;background:var(--progress);overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;padding:12px 4px}.note{text-align:center;font-size:11px;color:var(--muted);margin-top:17px}
.toast{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#263b3266;opacity:0;visibility:hidden;transition:.2s}.toast.show{opacity:1;visibility:visible}.modal{width:min(360px,100%);padding:26px 22px;border-radius:25px;background:linear-gradient(145deg,#fffdf8,#fff0d9);text-align:center;box-shadow:0 20px 60px #1c352d55;transform:scale(.94);transition:.2s}.toast.show .modal{transform:scale(1)}.eggicon{font-size:60px;display:block;animation:bob .6s ease-in-out infinite alternate}.modal h2{color:#9b7041;margin:8px 0}.modal p{color:#7e7468;font-size:14px;line-height:1.7;margin:0}.modal button{margin-top:18px;border:0;border-radius:13px;padding:12px 25px;background:#678c79;color:white;font-weight:800}@keyframes bob{to{transform:translateY(-8px) rotate(7deg)}}.spark{position:fixed;z-index:6;pointer-events:none;font-size:21px;animation:fly .85s ease-out forwards}@keyframes fly{to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.5)}}.win{position:fixed;inset:0;z-index:4;display:none;place-items:center;pointer-events:none}.win.show{display:grid}.win span{background:#fffdf2ed;padding:20px 26px;border-radius:20px;font-size:22px;font-weight:900;box-shadow:0 12px 35px #476b5542}
@media(min-width:600px){.grid{grid-template-columns:repeat(10,minmax(0,1fr));gap:10px}.tray{padding:22px}.sheet{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<div class="head"><span class="brand">POP POP STUDIO ✳</span><span class="pill">☁ 給自己一點放空時間</span></div>
<h1>啵啵時光 🫧</h1><p class="sub">一顆一顆慢慢擠，或用手指一路滑過去。今天的煩惱，就交給泡泡吧。</p>
<div class="stats"><div class="stat"><small>已擠破</small><strong id="count">0</strong></div><div class="stat"><small>剩餘泡泡</small><strong id="left">98</strong></div><div class="stat"><small>完成度</small><strong id="pct">0%</strong></div><div class="stat egg"><small>找到彩蛋</small><strong id="eggs">0/0</strong></div></div>
<div class="actions"><button class="btn" id="sound">🔊 音效開啟</button><button class="btn primary" id="reset">↻ 換一張泡泡紙</button></div>
<section class="tray"><div class="sheet" id="sheet"><div class="grid" id="grid" aria-label="泡泡紙"></div></div><div class="win" id="win"><span>✨ 全部擠完啦！🎉</span></div><div class="progress"><div id="bar"></div></div><div class="foot"><span>👆 點一下，或按住滑過泡泡</span><span id="msg">每一聲啵，都是小小的快樂。</span></div></section>
<p class="note">Made for a little moment of joy ♡</p></main>
<div class="toast" id="toast" role="dialog" aria-modal="true"><div class="modal"><span class="eggicon" id="eggicon">🥚</span><h2 id="eggt">發現隱藏彩蛋！</h2><p id="eggm">今天好運爆棚！</p><button id="close">收下好運 ♡</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),grid=$('grid'),sheet=$('sheet'),toast=$('toast');const total=window.matchMedia('(max-width:599px)').matches?98:100;
const messages=[['🥚','今天好運爆棚！','小小幸運正在靠近你，記得保持好心情。'],['💰','財運大開！','願好事和好運都朝你靠攏。'],['❤️','今天也要開心喔！','辛苦了，給自己一個大大的微笑。'],['🎁','神秘驚喜！','生活偶爾需要一點意想不到的小禮物。'],['🏆','隱藏版幸運玩家！','恭喜解鎖稀有彩蛋，你今天真的很可以！']];
const themes=[
['薄荷奶霜','#f4f8f2','#d9f0e5','#f8e9dc','#34443d','#82958a','#568a76','#fffdf7dc','#dce9df','#c9e4d6','#e3f3e9','#cce8d8','#afd2bf','#80b9a0','#addbc6','#d9f4e5','#55957966','#9bcab1','#c0dfcb','#dcefe0','#d7e8dc'],
['蜜桃蘇打','#fff5f0','#ffe0d5','#fce9f1','#59413e','#a1847d','#c97869','#fffdf9dc','#f3d9d0','#f5cfc4','#ffe7dc','#f4d4d0','#eabbb0','#d88f83','#f0b6a8','#ffe0d4','#c27e7066','#d9a49a','#f0c9bd','#f8e0d8','#f2d8d0'],
['薰衣草夢','#f7f4fc','#e6def8','#f4e5f3','#453d59','#9288a4','#8170ad','#fffdfbdf','#e5ddf1','#d8c9ee','#eee7f8','#d9d0ef','#c9b9e4','#a997d2','#c8b8eb','#e9e0ff','#8c78b966','#b6a7d4','#d5c9e9','#eee8f7','#e3dbef'],
['海鹽藍','#f1f8fc','#d9edf8','#e6f1fa','#354b5b','#8299a8','#4f88a8','#fbfeffdf','#d6e8f1','#bcddec','#e0f2f8','#c5e3f0','#a9d1e2','#75b0ca','#a7d5e6','#d8f1fa','#579bb566','#91c3d6','#b9dce9','#e0f2f7','#d3e8f1'],
['奶油芒果','#fff9ed','#ffedc7','#f9e8d8','#594a35','#a39477','#b58a3d','#fffef8df','#f0e2c4','#f2dfaa','#fff1c9','#f5e3b4','#e5d096','#d1ad58','#ead18a','#fff0bd','#b3944c66','#d7c080','#ecdda9','#f8edcf','#eee1bd']];
let lastTheme=-1,done=0,found=0,eggTotal=0,eggSet=new Set(),sound=true,audio=null,drag=false,last={x:0,y:0};
function theme(){let n=Math.floor(Math.random()*themes.length);if(n===lastTheme)n=(n+1+Math.floor(Math.random()*(themes.length-1)))%themes.length;lastTheme=n;let t=themes[n],r=document.documentElement.style;let keys=['name','bg','glow1','glow2','ink','muted','accent','card','border','sheet1','sheet2','sheet3','sheetBorder','bubbleDark','bubbleMid','bubbleLight','bubbleShadow','popped1','popped2','popped3','progress'];keys.forEach((k,i)=>{if(k==='glow1'||k==='glow2')r.setProperty('--'+k,t[i]);else r.setProperty('--'+k,t[i])});$('msg').textContent='本次主題：'+t[0]+' ✨';document.querySelector('meta[name="theme-color"]').content=t[1]}
function beep(egg=false){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;if(egg){[523,659,784].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=now+i*.09;o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.21)});return}
const duration=.105+Math.random()*.035, length=Math.ceil(audio.sampleRate*duration), buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);let decay=Math.random()*.018+.045;for(let i=0;i<length;i++){let t=i/audio.sampleRate;data[i]=(Math.random()*2-1)*Math.exp(-t/decay)*(1-.18*Math.sin(t*2100))}
let src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.value=1750+Math.random()*950;filter.Q.value=.7;gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.48,now+.003);gain.gain.exponentialRampToValueAtTime(.001,now+duration);src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start(now);src.stop(now+duration);
let thump=audio.createOscillator(),tg=audio.createGain();thump.type='sine';thump.frequency.setValueAtTime(210+Math.random()*65,now);thump.frequency.exponentialRampToValueAtTime(75,now+.045);tg.gain.setValueAtTime(.001,now);tg.gain.exponentialRampToValueAtTime(.16,now+.002);tg.gain.exponentialRampToValueAtTime(.001,now+.055);thump.connect(tg);tg.connect(audio.destination);thump.start(now);thump.stop(now+.06)
}catch(e){}}
function stats(){ $('count').textContent=done;$('left').textContent=total-done;$('pct').textContent=Math.round(done/total*100)+'%';$('eggs').textContent=found+'/'+eggTotal;$('bar').style.width=(done/total*100)+'%';if(done===total)$('win').classList.add('show')}
function spark(){['✨','⭐','💛','🎉'].forEach((s,i)=>{for(let j=0;j<3;j++){let e=document.createElement('span');e.className='spark';e.textContent=s;e.style.left='50%';e.style.top='48%';e.style.setProperty('--x',(Math.random()*240-120)+'px');e.style.setProperty('--y',(Math.random()*220-110)+'px');document.body.append(e);setTimeout(()=>e.remove(),900)}})}
function reveal(){found++;let m=messages[Math.floor(Math.random()*messages.length)];$('eggicon').textContent=m[0];$('eggt').textContent=m[1];$('eggm').textContent=m[2];toast.classList.add('show');spark();beep(true)}
function pop(b){if(!b||b.classList.contains('popped'))return;b.classList.add('popped');let i=+b.dataset.i;b.setAttribute('aria-pressed','true');done++;beep();if(eggSet.has(i)){eggSet.delete(i);reveal()}stats()}
function hit(x,y){let b=document.elementFromPoint(x,y)?.closest('.bubble');if(b&&grid.contains(b))pop(b)}
function sweep(x1,y1,x2,y2){let d=Math.hypot(x2-x1,y2-y1),steps=Math.max(1,Math.ceil(d/13));for(let i=0;i<=steps;i++){let k=i/steps;hit(x1+(x2-x1)*k,y1+(y2-y1)*k)}}
sheet.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag=true;last={x:e.clientX,y:e.clientY};hit(e.clientX,e.clientY);try{sheet.setPointerCapture(e.pointerId)}catch{}});
sheet.addEventListener('pointermove',e=>{if(!drag)return;sweep(last.x,last.y,e.clientX,e.clientY);last={x:e.clientX,y:e.clientY}});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>sheet.addEventListener(ev,()=>drag=false));window.addEventListener('blur',()=>drag=false);
function reset(){theme();done=found=0;eggTotal=3+Math.floor(Math.random()*3);eggSet=new Set();while(eggSet.size<eggTotal)eggSet.add(Math.floor(Math.random()*total));toast.classList.remove('show');$('win').classList.remove('show');grid.innerHTML='';let f=document.createDocumentFragment();for(let i=0;i<total;i++){let b=document.createElement('button');b.className='bubble';b.type='button';b.dataset.i=i;b.setAttribute('aria-label','泡泡 '+(i+1));b.setAttribute('aria-pressed','false');f.append(b)}grid.append(f);stats()}
$('reset').addEventListener('click',reset);$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 音效開啟':'🔇 音效關閉'});$('close').addEventListener('click',()=>toast.classList.remove('show'));toast.addEventListener('click',e=>{if(e.target===toast)toast.classList.remove('show')});reset();
})();
</script></body></html>
